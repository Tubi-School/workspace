name: tubi-workspace

# Local PostgreSQL for development. Production uses Neon; nothing in the
# application is aware of the difference beyond DATABASE_URL.
services:
  postgres:
    image: postgres:18-alpine
    container_name: tubi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tubi
      POSTGRES_PASSWORD: tubi
      POSTGRES_DB: tubi_workspace
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tubi -d tubi_workspace']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
