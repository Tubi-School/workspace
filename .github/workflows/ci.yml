name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turborepo phones home for telemetry unless told otherwise.
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        # The API imports generated TypeScript, so this has to exist before
        # anything type-checks. It reads the schema only and never connects.
        run: pnpm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Validate Prisma schema
        # Schema-only validation (parses prisma/schema.prisma and every
        # migration file); never opens a database connection, so no real
        # DATABASE_URL is required here beyond satisfying the datasource
        # block's own validation.
        run: pnpm --filter @tubi/api exec prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        # Every existing test mocks Prisma directly — none open a real
        # database connection — so no Postgres service container is needed
        # here, only a syntactically valid DATABASE_URL for env validation.
        run: pnpm --filter @tubi/api run test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_SECRET: ci-test-secret-at-least-32-characters-long

      - name: Build
        run: pnpm run build
